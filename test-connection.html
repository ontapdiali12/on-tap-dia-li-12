<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra kết nối</title>
<style>body{font-family:Segoe UI,Arial;padding:24px;max-width:720px;margin:auto}button{padding:10px 14px}pre{background:#f5f5f5;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<h1>Kiểm tra kết nối Google Sheets</h1><p>Trang này dùng để kiểm tra URL Web App trong <b>config.js</b>.</p>
<button id="ping">Kiểm tra kết nối</button><pre id="out"></pre>
<script src="config.js"></script><script>
document.getElementById("ping").onclick=async()=>{
 const o=document.getElementById("out");
 if(!RESULT_API_URL){o.textContent="Chưa có RESULT_API_URL trong config.js";return}
 try{const r=await fetch(RESULT_API_URL+"?action=ping&t="+Date.now());o.textContent=await r.text()}
 catch(e){o.textContent="Lỗi: "+e}
}
</script></body></html>
